// Top-level build file where you can add configuration options common to all sub-projects/modules.

import org.apache.tools.ant.taskdefs.condition.Os

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Windows: 프로젝트 경로가 길어도 CMake/NDK 빌드가 되도록 네이티브 캐시만 짧은 경로로 분리
// macOS/Linux에서는 기본 staging을 유지한다(C:/ 하드코딩이 Unix에서 상대 폴더를 만드는 부작용 방지).
subprojects { subproject ->
  subproject.afterEvaluate {
    if (!Os.isFamily(Os.FAMILY_WINDOWS)) {
      return
    }

    def hasNativePlugin = subproject.plugins.hasPlugin("com.android.library") ||
      subproject.plugins.hasPlugin("com.android.application")
    if (!hasNativePlugin) {
      return
    }

    def androidExt = subproject.extensions.findByName("android")
    def cmakeExt = androidExt?.externalNativeBuild?.cmake
    if (cmakeExt != null) {
      def cacheName = subproject.path.replace(":", "_").replace("/", "_")
      cmakeExt.buildStagingDirectory = new File("C:/AndroidCxx/${cacheName}")
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
