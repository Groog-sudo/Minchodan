name: Lint and Code Quality

on:
  pull_request:
    branches: [master, main, dev]
  push:
    # 2026-07-19: 브랜치 전략상 dev에 직접 push가 통합 경로이므로 CI가 돌아야 한다.
    branches: [master, main, dev]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Ruff Lint
        run: ruff check .

      - name: Bandit Security Scan
        run: bandit -c pyproject.toml -r server/ scripts/

      - name: mypy Type Check
        run: mypy server/

      - name: jscpd Duplication Check
        run: jscpd

      - name: pip-audit CVE Scan
        # ChromaDB는 수정 릴리스가 없고 로컬 PersistentClient만 사용한다.
        # 이 식별자 외에는 실패 처리한다.
        run: >-
          pip-audit -r requirements.txt
          --ignore-vuln CVE-2026-45829

      - name: Client npm Audit
        working-directory: client
        run: npm audit --audit-level=high

      - name: Console npm Audit
        working-directory: console
        run: npm audit --audit-level=high

      - name: pytest - Unit Tests
        # 2026-07-19: pytest 단계 신설. Ollama/실행 서버가 필요한 통합 테스트는 마커로 제외.
        # GPU/모델/네트워크 의존 테스트가 추가로 발견되면 동일하게 마커를 도입해 제외한다.
        run: python -m pytest -m "not ollama and not live_server" -q
