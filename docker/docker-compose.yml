# Minchodan Docker Compose
# Redis + Ollama + FastAPI 3컨테이너 구성
# 상세 명세: docs/deployment_guide.md 7절

services:
  fastapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: minchodan-server:latest
    container_name: minchodan-fastapi
    ports:
      - "${WS_PORT:-8000}:8000"
    volumes:
      - ../server:/app/server
      - ../data:/app/data
      - ../scripts:/app/scripts
      - ../tests:/app/tests
      - ../.env:/app/.env:ro
      - ../requirements.txt:/app/requirements.txt:ro
    env_file:
      - ../.env
    environment:
      # Docker Compose 환경에서는 컨테이너 서비스명과 호스트 Ollama 주소로 재설정
      - REDIS_URL=redis://redis:6379
      # Ollama는 도커 외부 로컬에서 별도로 띄우므로 host.docker.internal 사용
      - OLLAMA_BASE_URL=${COMPOSE_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DB_TYPE=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=${COMPOSE_DB_NAME:-minchodan_db}
      - DB_USER=${COMPOSE_DB_USER:-minchodan_team}
      - DB_PASSWORD=${COMPOSE_DB_PASSWORD:-minchodan_password}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - minchodan-net
    # GPU 접근 (NVIDIA Container Toolkit 필요, GPU가 없는 환경에서는 아래 deploy 블록을 주석 처리하십시오)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: minchodan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - minchodan-net

  mariadb:
    image: mariadb:11.4
    container_name: minchodan-mariadb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - "../Minchodan DB.session.sql:/docker-entrypoint-initdb.d/01_minchodan_schema.sql:ro"
    environment:
      MARIADB_DATABASE: ${COMPOSE_DB_NAME:-minchodan_db}
      MARIADB_USER: ${COMPOSE_DB_USER:-minchodan_team}
      MARIADB_PASSWORD: ${COMPOSE_DB_PASSWORD:-minchodan_password}
      MARIADB_ROOT_PASSWORD: ${COMPOSE_DB_ROOT_PASSWORD:-minchodan_root_password}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - minchodan-net

volumes:
  redis_data:
  mariadb_data:

networks:
  minchodan-net:
    driver: bridge
